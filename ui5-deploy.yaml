# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "3.0"
metadata:
  name: yatl01.reportecolumnasdinamicas
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateVersionInfo
      configuration:
        ignoreCertErrors: true     # temporal
        target:
          url: https://mqademoaws.mqaamericas.com:44300
          client: "100"
          auth: basic
        credentials:
          username: env:UI5_USERNAME
          password: env:UI5_PASSWORD
        app:
          name: YATL01
          description: Reporte Columnas Dinamicas
          package: YMQA001
          transport: DMPK900010
        exclude:
          - /test/
          - /localService/