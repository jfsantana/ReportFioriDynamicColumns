# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "3.0"
metadata:
  name: yatl01.reportecolumnasdinamicas
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateVersionInfo
      configuration:
        target:
          url: http://demo.mqaamericas.com:8005
          client: "300"
          auth: basic
        credentials:
          username: env:UI5_USERNAME
          password: env:UI5_PASSWORD
        app:
          name: YATL01
          description: Reporte Columnas Dinamicas
          package: YATL01
          transport: DM2K900719
        exclude:
          - /test/
          - /localService/